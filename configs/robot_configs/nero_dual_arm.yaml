states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 7
        - observation.state:
            start: 8
            end: 15

  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 7
            end: 8
        - observation.state:
            start: 15
            end: 16

actions:
  - action.arm.position:
      origin_keys:
        - action:
            start: 0
            end: 7
        - action:
            start: 8
            end: 15
      subtract_state: true
      relative_type: euclidean

  - action.effector.position:
      origin_keys:
        - action:
            start: 7
            end: 8
        - action:
            start: 15
            end: 16
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.cam0

norm_stats: assets/norm_stats/nero_dual_arm.json
